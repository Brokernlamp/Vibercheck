name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://localhost:5432/vibecheck
      SESSION_SECRET: ci-only-session-secret-not-for-deployment
      APP_URL: https://ci.example.invalid
      MAIL_FROM: VibeCheck CI <ci@example.invalid>
      RESEND_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan:benchmark
      - run: npm run build
