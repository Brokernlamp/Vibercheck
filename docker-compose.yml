name: vibecheck

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    <<: *logging

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    <<: *logging

  app:
    build:
      context: .
      target: runner
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - sources:/app/.data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    <<: *logging

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - sources:/app/.data
    stop_grace_period: 2m
    restart: unless-stopped
    <<: *logging

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    <<: *logging

volumes:
  pgdata:
  sources:
  caddy_data:
  caddy_config:
